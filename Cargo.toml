[package]
name = "win-uia2-nofocus"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Minimal safe Rust wrapper for Windows CUIAutomation8 with IUIAutomation2::SetAutoSetFocus(false) and readback verification"
repository = "https://github.com/muhamedsohaib/win-uia2-nofocus"
readme = "README.md"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", default-features = false, features = [
    "Win32_System_Com",
    "Win32_UI_Accessibility",
] }

[lints.rust]
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
